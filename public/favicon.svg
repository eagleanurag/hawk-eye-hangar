<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="HawkEye Hangar">
  <title>HawkEye Hangar</title>
  <!--
    Vector companion to public/brand/hawkeye-hangar-favicon-source.png.

    Browsers that support SVG favicons pick this file over the PNG/ICO set, so
    it has to be the SAME mark as the raster, not an older one. It is a
    deliberately simplified reduction of that master — shield outline, hangar
    mouth, head-on delta-wing aircraft — because at 16-64px none of the hangar
    interior detail survives anyway, and detail here costs legibility.

    The raster masters remain the artwork of record; this file is the scalable
    favicon layer. It is never used for the navbar, hero or social imagery.
  -->
  <defs>
    <linearGradient id="he-hangar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2740"/>
      <stop offset="100%" stop-color="#080d16"/>
    </linearGradient>
    <linearGradient id="he-skin" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#f2f6fc"/>
      <stop offset="55%" stop-color="#c3d0e2"/>
      <stop offset="100%" stop-color="#7d8ea8"/>
    </linearGradient>
    <linearGradient id="he-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f5c8c"/>
      <stop offset="100%" stop-color="#0a1826"/>
    </linearGradient>
  </defs>

  <!-- hangar mouth: the dark interior the aircraft sits in -->
  <path d="M32 5 57 16v19c0 12-10.5 20.5-25 24.5C17.5 55.5 7 47 7 35V16Z" fill="url(#he-hangar)"/>

  <!-- hangar roof trusses, three receding bays -->
  <g fill="none" stroke="#4a5a72" stroke-width="1.1" stroke-linecap="round" opacity=".7">
    <path d="M13 24 32 12l19 12"/>
    <path d="M15 30 32 20l17 10"/>
    <path d="M17 36 32 28l15 8"/>
  </g>
  <!-- ceiling strip lights -->
  <g fill="#cfe6ff" opacity=".55">
    <rect x="26" y="17" width="12" height="1.6" rx=".8"/>
    <rect x="28" y="25" width="8" height="1.4" rx=".7"/>
  </g>

  <!-- hangar threshold, the lit apron the wheels stand on -->
  <path d="M7 47h50l-4 3H11Z" fill="#f58220" opacity=".22"/>

  <!-- aircraft, head-on: swept delta wing, twin tails, canopy -->
  <g>
    <!-- left wing, then right, mirrored about x=32 -->
    <path d="M31 27 6 41l3 3 22-9Z" fill="url(#he-skin)"/>
    <path d="M33 27 58 41l-3 3-22-9Z" fill="url(#he-skin)"/>
    <!-- wing-root accent -->
    <path d="M31 27 20 33l1.5 2.5 9.5-5.5Z" fill="#f58220"/>
    <path d="M33 27 44 33l-1.5 2.5L33 30Z" fill="#f58220"/>
    <!-- twin vertical tails -->
    <path d="M27.5 27 24.5 17l3.2 1.4 3 8Z" fill="#b9c8dc"/>
    <path d="M36.5 27 39.5 17l-3.2 1.4-3 8Z" fill="#b9c8dc"/>
    <!-- fuselage -->
    <path d="M32 16c3 0 4.6 3.2 4.6 8 0 8-2 15-4.6 21-2.6-6-4.6-13-4.6-21 0-4.8 1.6-8 4.6-8Z" fill="url(#he-skin)"/>
    <!-- canopy -->
    <path d="M32 25c2 0 3 1.6 3 4s-1.2 5-3 7c-1.8-2-3-4.6-3-7s1-4 3-4Z" fill="url(#he-glass)"/>
    <!-- nose gear -->
    <path d="M32 45v4" stroke="#9fb0c6" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="32" cy="50" r="1.7" fill="#c9d6e6"/>
  </g>

  <!-- shield outline, drawn last so it always reads -->
  <path d="M32 5 57 16v19c0 12-10.5 20.5-25 24.5C17.5 55.5 7 47 7 35V16Z"
        fill="none" stroke="#f58220" stroke-width="2.6" stroke-linejoin="round"/>
</svg>
