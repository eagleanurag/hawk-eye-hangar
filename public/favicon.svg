<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="EagleEye Hangar">
  <title>EagleEye Hangar</title>
  <defs>
    <linearGradient id="ee" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#9fe9ff"/>
      <stop offset="55%" stop-color="#4fd6ff"/>
      <stop offset="100%" stop-color="#1273a8"/>
    </linearGradient>
  </defs>

  <!-- hangar bezel -->
  <rect width="64" height="64" rx="13" fill="#070b14"/>
  <path d="M6 32 17 12h30l11 20-11 20H17Z" fill="none" stroke="url(#ee)" stroke-opacity=".45" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- eye lens -->
  <path d="M11 32c6.2-8.4 13-12.6 21-12.6S46.8 23.6 53 32c-6.2 8.4-13 12.6-21 12.6S17.2 40.4 11 32Z" fill="url(#ee)"/>

  <!-- aircraft delta as the pupil -->
  <path d="M32 23.4 38.4 37 32 33.4 25.6 37Z" fill="#070b14"/>

  <!-- instrument tick -->
  <path d="M32 46.6v3.2" stroke="url(#ee)" stroke-width="2.2" stroke-linecap="round"/>
</svg>
